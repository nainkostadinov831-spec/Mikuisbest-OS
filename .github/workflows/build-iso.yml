name: Build Mikoisbest OS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 180
    steps:
      - name: Install git for checkout
        run: apt-get update && apt-get install -y git ca-certificates sudo

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare build host (install live-build + deps)
        run: bash scripts/00-prepare-host.sh

      - name: Initialize live-build config
        run: bash scripts/01-init-config.sh

      - name: Build the ISO
        run: bash build.sh

      - name: Show build output
        run: ls -la Mikoisbest_OS_v1.iso Mikoisbest_OS_v1.iso.sha256

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mikoisbest_OS_v1
          path: |
            Mikoisbest_OS_v1.iso
            Mikoisbest_OS_v1.iso.sha256
          retention-days: 7
