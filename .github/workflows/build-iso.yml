name: Build Mikoisbest OS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force || true
          echo "After cleanup:"
          df -h /

      - name: Prepare build host (install live-build + deps)
        run: sudo bash scripts/00-prepare-host.sh

      - name: Initialize live-build config
        run: bash scripts/01-init-config.sh

      - name: Build the ISO
        run: sudo bash build.sh

      - name: Show build output
        run: ls -la Mikoisbest_OS_v1.iso Mikoisbest_OS_v1.iso.sha256

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mikoisbest_OS_v1
          path: |
            Mikoisbest_OS_v1.iso
            Mikoisbest_OS_v1.iso.sha256
          retention-days: 7
